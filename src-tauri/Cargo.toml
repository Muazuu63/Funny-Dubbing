[package]
name = "ai-vps-studio"
version = "2.2.0"
description = "AI-VPS Studio: Local AI Funny Dubbing & Video Production Suite"
authors = ["AI-VPS Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
